version: 1.4.0
pr_number: 71
new_features:
- description: Raises the minimum dbt version to 1.10.0.
- description: Adds `dbt_utils.unique_combination_of_columns` tests to staging and end models. If a test fails, please [open an issue](https://github.com/fivetran/dbt_mailchimp/issues/new/choose).
bug_fixes:
- description: Updates the `stg_mailchimp__unsubscribes` documentation to list the `unsubscribe_reason` and `unsubscribe_timestamp` columns that the model outputs. The yml previously documented these columns under their pre-aliased names, `reason` and `timestamp`.
